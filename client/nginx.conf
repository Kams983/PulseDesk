server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index index.html;

  client_max_body_size 1m;

  # the api keeps its own path, so /api/v1/... arrives at the server unchanged
  location /api/ {
    proxy_pass http://server:5000;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # socket.io needs the upgrade headers, and a long read timeout so a quiet board is not dropped
  location /socket.io/ {
    proxy_pass http://server:5000;
    proxy_http_version 1.1;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection "upgrade";
    proxy_set_header Host $host;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_read_timeout 3600s;
  }

  # one index.html for every route, because the client owns its own routing
  location / {
    try_files $uri $uri/ /index.html;
  }

  # the bundle is fingerprinted, so it can be cached for as long as the name says
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }
}
