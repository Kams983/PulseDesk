services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 20s

  server:
    build: ./server
    restart: unless-stopped
    # the api waits for a mongod that answers, not merely one that started
    depends_on:
      mongo:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 5000
      MONGO_URI: mongodb://mongo:27017/emr
      # no default on purpose: compose stops with a message rather than shipping a known secret.
      # generate one with `openssl rand -hex 32` and put it in a root .env file.
      JWT_ACCESS_SECRET: ${JWT_ACCESS_SECRET:?set JWT_ACCESS_SECRET, see the README}
      ACCESS_TOKEN_TTL: ${ACCESS_TOKEN_TTL:-15m}
      REFRESH_TOKEN_TTL_DAYS: ${REFRESH_TOKEN_TTL_DAYS:-7}
      # the browser reaches the api through nginx on the client's own origin, so that is the one origin
      # CORS has to name for the refresh cookie to be sent
      CLIENT_ORIGIN: ${CLIENT_ORIGIN:-http://localhost:8080}
      CLINIC_TIMEZONE: ${CLINIC_TIMEZONE:-Africa/Lagos}
    ports:
      - "5000:5000"
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:5000/api/v1/health"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s

  client:
    build: ./client
    restart: unless-stopped
    depends_on:
      server:
        condition: service_healthy
    ports:
      - "8080:80"

volumes:
  mongo-data:
